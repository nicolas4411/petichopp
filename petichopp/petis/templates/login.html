{% extends 'base.html' %}

{% block title %}Login - PetiChopp{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2>🔐 Entrar no Sistema</h2>

    {% if erro %}
    <p style="color: red; font-weight: bold;">{{ erro }}</p>
    {% endif %}

    <!-- O action="{% url 'login' %}" e method="POST" são fundamentais aqui -->
    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <div>
            <label>Usuário:</label><br>
            <input type="text" name="username" style="width: 100%; padding: 8px;" required>
        </div>
        <br>
        <div>
            <label>Senha:</label><br>
            <input type="password" name="password" style="width: 100%; padding: 8px;" required>
        </div>
        <br>
        <button type="submit"
            style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; font-size: 16px; cursor: pointer;">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
